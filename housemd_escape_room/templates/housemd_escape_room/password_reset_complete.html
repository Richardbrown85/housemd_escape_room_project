{% extends 'housemd_escape_room/base.html' %}

{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-custom">
                <div class="card-header bg-custom text-white text-center">
                    <div class="my-3">
                        <i class="fas fa-check-circle fa-3x"></i>
                    </div>
                    <h3 class="mb-0">Password Reset Complete!</h3>
                </div>
                <div class="card-body text-center">
                    <p class="lead mb-4">
                        Your password has been successfully reset.
                    </p>

                    <div class="alert alert-light border-custom">
                        <i class="fas fa-info-circle text-custom"></i>
                        <p class="mb-0 mt-2">
                            You can now log in with your new password.
                        </p>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'login' %}" class="btn btn-custom btn-lg">
                            <i class="fas fa-sign-in-alt"></i> Go to Login
                        </a>
                    </div>

                    <hr class="my-4">

                    <p class="small text-muted mb-0">
                        <i class="fas fa-shield-alt"></i> 
                        Make sure to keep your password secure and don't share it with anyone.
                    </p>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="{% url 'home' %}" class="text-custom">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
